# CSMS backend/frontend product, plus a complete CitrineOS-core stack
# (citrine/ocpp-db/amqp-broker/minio/graphql-engine below) so
# `docker compose up --build` alone gives you both, per
# docs/architecture-proposal.md §2. CitrineOS itself is still never forked
# or patched: these services run its own published images
# (ghcr.io/citrineos/citrineos-server, hasura/graphql-engine) exactly as
# its own docker-compose.yml does, reached only over the network (Data/
# Message API, Subscriptions) — see citrineos-vendor/README.md for the one
# piece of CitrineOS deployment config (Hasura metadata) vendored here to
# make that possible without also cloning citrineos-core.
#
# The bundled CitrineOS services below carry `profiles: ["citrineos-core"]`
# and .env.example ships `COMPOSE_PROFILES=citrineos-core` uncommented —
# Compose reads that from .env automatically, so a plain `docker compose up`
# activates the profile with no --profile flag typed. To point at an
# existing CitrineOS deployment instead, remove that line from your own
# .env (or set COMPOSE_PROFILES= empty) and configure
# settings/citrineos/dataApiUrl+messageApiUrl yourself (see README.md).
#
# Increments 1-7 (so far): product database + BFF backend, the ops-agent
# below, the bundled CitrineOS-core stack, plus the optional
# citrineos-payment/Directus and own-Hasura-instance services (behind
# Compose profiles — see docs/architecture-proposal.md §4/§9/§11 for why
# they're needed at all).

services:
  product-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PRODUCT_DB_USER:-csms}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD in .env}
      POSTGRES_DB: ${PRODUCT_DB_NAME:-csms_product}
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER:-csms} -d ${PRODUCT_DB_NAME:-csms_product}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${PRODUCT_DB_PORT:-55432}:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # network/args below only matter when building behind the sandbox's
      # TLS-intercepting dev proxy (see /root/.ccr/README.md); harmless and
      # unused in a normal environment where these variables are unset.
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    restart: unless-stopped
    depends_on:
      product-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PRODUCT_DB_USER:-csms}:${PRODUCT_DB_PASSWORD}@product-db:5432/${PRODUCT_DB_NAME:-csms_product}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:?set SETTINGS_MASTER_KEY in .env}
      OPS_AGENT_URL: http://ops-agent:3100
      OPS_AGENT_SHARED_SECRET: ${OPS_AGENT_SHARED_SECRET:?set OPS_AGENT_SHARED_SECRET in .env}
      # Read by docker-entrypoint.sh to seed the first login on every
      # start (idempotent — see the seed script). Required so
      # citrineos-config-init below has a SuperAdmin to authenticate as.
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-superadmin@example.com}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?set SEED_SUPERADMIN_PASSWORD in .env}
      PORT: "3000"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Whitelisted container-ops microservice — see ops-agent/README.md. Has
  # Docker socket access (needed to inspect/restart the OTHER containers in
  # this stack), which `backend` itself never gets; `backend` reaches it only
  # over the internal Compose network, authenticated by
  # OPS_AGENT_SHARED_SECRET. No public port: this is deliberately
  # unreachable from outside the Compose network.
  ops-agent:
    build:
      context: .
      dockerfile: ops-agent/Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    restart: unless-stopped
    environment:
      OPS_AGENT_SHARED_SECRET: ${OPS_AGENT_SHARED_SECRET:?set OPS_AGENT_SHARED_SECRET in .env}
      PORT: "3100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---- Bundled CitrineOS-core stack (profile "citrineos-core", active by
  # default via COMPOSE_PROFILES in .env.example — see the file header) ----
  #
  # Mirrors citrineos-core's own docker-compose.yml services/env/healthchecks
  # (citrine, ocpp-db, amqp-broker, minio, minio-init, graphql-engine)
  # verbatim, minus its `citrine-ui`/`citrineos-ocpi` profiles — VibeOCPP has
  # its own frontend, and citrine-ui would collide with backend on port 3000.
  citrine:
    image: ghcr.io/citrineos/citrineos-server:latest
    pull_policy: always
    restart: unless-stopped
    profiles: ["citrineos-core"]
    environment:
      APP_NAME: "all"
      APP_ENV: "docker"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${CITRINEOS_CORE_MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${CITRINEOS_CORE_MINIO_ROOT_PASSWORD:-minioadmin}
      DB_STRATEGY: "migrate"
      BOOTSTRAP_CITRINEOS_DATABASE_HOST: "ocpp-db"
      BOOTSTRAP_CITRINEOS_CONFIG_FILENAME: "config.json"
      BOOTSTRAP_CITRINEOS_FILE_ACCESS_TYPE: "local"
      BOOTSTRAP_CITRINEOS_FILE_ACCESS_LOCAL_DEFAULT_FILE_PATH: "/data"
      CONFIG_CITRINEOS_WIPE_FILE_ON_START: "false"
    depends_on:
      ocpp-db:
        condition: service_healthy
      amqp-broker:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${CITRINEOS_CORE_HTTP_PORT:-8080}:8080"
      - "${CITRINEOS_CORE_WS_PORT:-8081}:8081"
      - "${CITRINEOS_CORE_WS_BASIC_AUTH_PORT:-8082}:8082"
      - "${CITRINEOS_CORE_WSS_PORT:-8443}:8443"
      - "${CITRINEOS_CORE_WSS_MTLS_PORT:-8444}:8444"
    # Verbatim from citrineos-core's own docker-compose.yml — a plain TCP
    # connect check against its REST/OCPP port, not something worth
    # reinventing.
    healthcheck:
      test: [
          "CMD-SHELL",
          "node -e \"const net = require(\\\"net\\\"); const client =
          net.createConnection(8080, \\\"127.0.0.1\\\", () => { client.end();
          process.exit(0); }); client.on(\\\"error\\\", () =>
          process.exit(1)); client.setTimeout(5000, () => { client.destroy();
          process.exit(1); });\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ocpp-db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    restart: unless-stopped
    profiles: ["citrineos-core"]
    environment:
      POSTGRES_DB: citrine
      POSTGRES_USER: citrine
      POSTGRES_PASSWORD: ${CITRINEOS_CORE_DB_PASSWORD:-citrine}
    volumes:
      - citrine-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U citrine -d citrine"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s

  amqp-broker:
    image: rabbitmq:3-management
    restart: unless-stopped
    profiles: ["citrineos-core"]
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    volumes:
      - citrine-amqp-data:/var/lib/rabbitmq
    ports:
      - "${CITRINEOS_CORE_AMQP_PORT:-5672}:5672"
      - "${CITRINEOS_CORE_AMQP_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio
    restart: unless-stopped
    profiles: ["citrineos-core"]
    environment:
      MINIO_ROOT_USER: ${CITRINEOS_CORE_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CITRINEOS_CORE_MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${CITRINEOS_CORE_MINIO_CONSOLE_PORT:-9001}
      MINIO_SERVER_URL: http://localhost:${CITRINEOS_CORE_MINIO_PORT:-9000}
    volumes:
      - citrine-minio-data:/data
    command: server /data --console-address ":9001"
    ports:
      - "${CITRINEOS_CORE_MINIO_PORT:-9000}:9000"
      - "${CITRINEOS_CORE_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc
    profiles: ["citrineos-core"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "set -x
      mc alias set myminio http://minio:9000 ${CITRINEOS_CORE_MINIO_ROOT_USER:-minioadmin} ${CITRINEOS_CORE_MINIO_ROOT_PASSWORD:-minioadmin} || echo 'FAILED: alias setup'"

  # CitrineOS-core's own Hasura instance (its apps/operator-ui talks to
  # this) — separate from VibeOCPP's own read-only mirror further below.
  # See citrineos-vendor/README.md for why hasura-metadata is vendored here.
  graphql-engine:
    image: hasura/graphql-engine:v2.40.3.cli-migrations-v3
    restart: unless-stopped
    profiles: ["citrineos-core"]
    volumes:
      - ./citrineos-vendor/hasura-metadata:/hasura-metadata
    depends_on:
      citrine:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://citrine:${CITRINEOS_CORE_DB_PASSWORD:-citrine}@ocpp-db:5432/citrine
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
    ports:
      - "${CITRINEOS_CORE_HASURA_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://graphql-engine:8080/healthz"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Writes settings/citrineos/* against the backend as SuperAdmin so
  # /citrineos/* endpoints work right after `docker compose up`, with no
  # manual curl steps — see scripts/init-citrineos-settings.mjs for the
  # idempotency reasoning. Runs once and exits; nothing depends on it.
  citrineos-config-init:
    image: node:22-alpine
    profiles: ["citrineos-core"]
    depends_on:
      backend:
        condition: service_healthy
      citrine:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:3000
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-superadmin@example.com}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?set SEED_SUPERADMIN_PASSWORD in .env}
      CITRINEOS_DATA_API_URL: http://citrine:8080
      CITRINEOS_MESSAGE_API_URL: http://citrine:8080
      CITRINEOS_TENANT_ID: "1"
      CITRINEOS_OCPP_VERSION: "2"
      WEBHOOK_BASE_URL: http://backend:3000
    volumes:
      - ./scripts/init-citrineos-settings.mjs:/init.mjs:ro
    command: ["node", "/init.mjs"]

  # ---- Optional: citrineos-payment + Directus (`docker compose --profile payment up`) ----
  #
  # citrineos-payment is CitrineOS's own Stripe/Scan&Charge module — we run
  # it unmodified, the same principle as CitrineOS-core itself. It has no
  # admin API for Operators/Locations/Evses/Connectors/Tariffs (see
  # docs/architecture-proposal.md §4), which is what backend/src/payment/
  # talks to directly instead: both this container and our backend write
  # into the SAME `citrine_payment.databaseUrl` database — the one CitrineOS
  # core itself uses, not our own product-db above.
  #
  # There is no published Docker image for citrineos-payment as of this
  # writing, so this builds from a local clone — point CITRINEOS_PAYMENT_PATH
  # in .env at one:
  #   git clone https://github.com/citrineos/citrineos-payment ../citrineos-payment
  # citrineos-payment's own Dockerfile refuses to build without a `.env`
  # file inside that clone — copy its `.env.example` to `.env` and fill in
  # real values there (Stripe keys, CITRINEOS_DATA_API_URL/MESSAGE_API_URL
  # pointed at your CitrineOS deployment, MESSAGE_BROKER_* pointed at its
  # RabbitMQ, DB_HOST/DB_DATABASE pointed at its Postgres) before building.
  #
  # The `:-` defaults below (rather than `:?`) are deliberate: Compose
  # interpolates every service's variables during `docker compose config`
  # even for services outside the active profile, so a required (`:?`)
  # variable here would break the base `docker compose up` for everyone who
  # hasn't set up payment yet. Leaving these unset just fails the build with
  # a clear "path not found" once you actually run `--profile payment up`.
  citrineos-payment:
    profiles: ["payment"]
    build:
      context: ${CITRINEOS_PAYMENT_PATH:-./citrineos-payment}
    restart: unless-stopped
    env_file:
      - ${CITRINEOS_PAYMENT_PATH:-./citrineos-payment}/.env
    ports:
      - "${CITRINEOS_PAYMENT_PORT:-9010}:9010"

  # File store for the Scan&Charge QR code image — citrineos-payment's
  # DirectusIntegration is a hard dependency at container start regardless
  # of the CITRINEOS_SCAN_AND_CHARGE flag (a startup bug in that container,
  # not something we can configure around without patching it). Bootstraps
  # its own admin account from the env vars below; nothing else uses it.
  # Same `:-` reasoning as above — set real values in .env before running
  # `--profile payment up`.
  directus:
    profiles: ["payment"]
    image: directus/directus:11
    restart: unless-stopped
    environment:
      KEY: ${DIRECTUS_KEY:-change-me-openssl-rand-hex-32}
      SECRET: ${DIRECTUS_SECRET:-change-me-openssl-rand-hex-32}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-me}
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db
    volumes:
      - directus-data:/directus/database
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"

  # ---- Optional: our own read-only Hasura instance (`docker compose --profile hasura up`) ----
  #
  # A SEPARATE Hasura instance from CitrineOS's own (the one its
  # apps/operator-ui uses) — same underlying CitrineOS-core database, our
  # own metadata (./hasura/metadata), never touching citrineos-core's repo
  # or compose file. Per docs/architecture-proposal.md §9: the frontend
  # reads live/list CitrineOS data straight from this instance over
  # GraphQL (subscriptions included) using the same JWT the backend issues
  # — see the "https://hasura.io/jwt/claims" claim AuthService embeds — but
  # every write still goes through the BFF's REST endpoints. This instance
  # has no insert/update/delete permissions configured anywhere in
  # ./hasura/metadata, on purpose.
  #
  # Uses the same graphql-engine version CitrineOS-core itself pins, for
  # compatibility with the schema it's reading. The `.cli-migrations-v3`
  # image tag is what makes the ./hasura/metadata mount below auto-apply on
  # startup — a plain `hasura/graphql-engine` image does not do this.
  #
  # HASURA_GRAPHQL_DATABASE_URL points at CitrineOS-core's own Postgres —
  # NOT product-db above, and NOT something we can put in our own settings
  # table (Hasura is a separate container we don't control at runtime).
  # Defaults to the bundled ocpp-db above with its own default password
  # (works out of the box together with the citrineos-core profile; if you
  # changed CITRINEOS_CORE_DB_PASSWORD, set CITRINEOS_DATABASE_URL to match
  # — Compose doesn't nest `${VAR:-default}` fallbacks reliably enough to
  # derive one from the other). Override CITRINEOS_DATABASE_URL in .env if
  # pointing at an external CitrineOS instead. `:-` defaults, not `:?`, for
  # the same reason as the payment services.
  hasura:
    profiles: ["hasura"]
    image: hasura/graphql-engine:v2.40.3.cli-migrations-v3
    restart: unless-stopped
    volumes:
      - ./hasura/metadata:/hasura-metadata
    environment:
      HASURA_GRAPHQL_DATABASE_URL: ${CITRINEOS_DATABASE_URL:-postgres://citrine:citrine@ocpp-db:5432/citrine}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-change-me}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${JWT_ACCESS_SECRET:-change-me}"}'
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
    ports:
      - "${HASURA_PORT:-8091}:8080"

volumes:
  product-db-data:
  directus-data:
  citrine-db-data:
  citrine-amqp-data:
  citrine-minio-data:
